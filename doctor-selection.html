<body class="flex flex-col items-center p-4 sm:p-8">

        <nav class="w-full bg-ayur-light-green text-ayur-dark-text shadow-lg fixed top-0 z-10">

    <!-- Header -->

    <!-- Stepper (Visual Progression) - Reduced to 3 steps -->

        <div class="flex flex-col items-center">

                 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>

    <!-- Main Content Card -->
    <div class="w-full max-w-4xl bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-ayur-light-brown">
        
        <h2 class="text-2xl font-semibold mb-6 text-ayur-brown flex items-center space-x-3">
            <svg class="w-7 h-7 text-ayur-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span>Select Location and Clinic</span>

        <!-- Location Selection -->
        <div class="mb-8 p-4 bg-ayur-cream rounded-lg border border-ayur-light-brown">
            <label for="city" class="block text-ayur-dark-text font-medium mb-2">1. Your Current Location (City)</label>
            <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3">
                <select id="city" onchange="filterClinics(this.value)" class="w-full sm:w-2/3 p-3 rounded-lg border border-ayur-light-brown focus:ring-ayur-green focus:border-ayur-green text-ayur-dark-text bg-white">
                    <option value="">-- Select Your City --</option>
                    <option value="bangalore">Bengaluru, KA</option>
                    <option value="mumbai">Mumbai, MH</option>
                    <option value="delhi">New Delhi, DL</option>
                    <option value="chennai">Chennai, TN</option>
                    <option value="lucknow">Lucknow, UP</option> <!-- NEW CITY ADDED -->
                    <option value="unknown">Unknown City (Manual Selection)</option>
                </select>
                <button id="detect-location-btn" onclick="detectLocation()" class="w-full sm:w-1/3 bg-ayur-green text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center space-x-2 transition-colors hover:bg-ayur-brown">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Detect My Location</span>

            </div>
            <p id="location-status" class="text-sm text-ayur-brown mt-2"></p>
        </div>

        <!-- Clinic Selection -->
        <div class="mb-8">
            <label class="block text-ayur-dark-text font-medium mb-4">2. Select Your Preferred Panchakarma Center</label>
            <div id="clinic-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Clinic Cards will be injected here by JavaScript -->
            </div>
            <p id="clinic-placeholder" class="text-ayur-brown mt-4 text-center hidden">Please select a city to see available clinics.</p>
        </div>
        
        <!-- Doctor Selection -->
        <div class="mb-8">
            <label class="block text-ayur-dark-text font-medium mb-4">3. Select Your Doctor</label>
            <div id="doctor-cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-ayur-brown mt-2 text-center md:col-span-3">Select a clinic first to view available doctors.</p>
            </div>
        </div>

        <!-- Navigation Button -->
        <div class="flex justify-end pt-4 border-t border-ayur-light-brown">
            <button id="next-button" disabled class="bg-gray-400 text-white font-semibold py-3 px-8 rounded-full transition-all duration-300 shadow-md opacity-50 cursor-not-allowed">
                Next 
            </button>
        </div>

    </div>

    <script>
        // Mock Data Structure
        const clinicsData = {
            'bangalore': [
                { id: 'C001', name: 'Ayur Wellness Center', rating: 4.8, specialization: 'Panchakarma & Detox', address: 'Koramangala, Bengaluru' },
                { id: 'C002', name: 'Veda Life Hospital', rating: 4.5, specialization: 'Joint Care & Therapy', address: 'Jayanagar, Bengaluru' },
            ],
            'mumbai': [
                { id: 'C003', name: 'Holistic Harmony Clinic', rating: 4.9, specialization: 'Stress Management', address: 'Bandra West, Mumbai' },
                { id: 'C004', name: 'Prakriti Ayurveda', rating: 4.4, specialization: 'Skin & Immunity', address: 'Andheri East, Mumbai' },
            ],
            'delhi': [
                { id: 'C005', name: 'Divine Healing Centre', rating: 4.7, specialization: 'Chronic Ailments', address: 'Dwarka, New Delhi' },
                { id: 'C006', name: 'Healthy Heart Clinic', rating: 4.6, specialization: 'Cardio Care', address: 'Punjabi Bagh, New Delhi' },
            ],
            'chennai': [
                { id: 'C007', name: 'South Ayur Center', rating: 4.3, specialization: 'Traditional Therapy', address: 'T. Nagar, Chennai' },
            ],
            'lucknow': [ // NEW LUCKNOW DATA
                { id: 'C008', name: 'Nawab City Wellness', rating: 4.6, specialization: 'Respiratory & Immunity', address: 'Gomti Nagar, Lucknow' },
                { id: 'C009', name: 'Awadh Panchakarma', rating: 4.9, specialization: 'Detox & Rejuvenation', address: 'Hazratganj, Lucknow' },
            ],
            // Allows manual selection of clinics regardless of location status
            'unknown': [
                { id: 'C001', name: 'Ayur Wellness Center (BLR)', rating: 4.8, specialization: 'Panchakarma & Detox', address: 'Koramangala, Bengaluru' },
                { id: 'C003', name: 'Holistic Harmony Clinic (MUM)', rating: 4.9, specialization: 'Stress Management', address: 'Bandra West, Mumbai' },
                { id: 'C005', name: 'Divine Healing Centre (DL)', rating: 4.7, specialization: 'Chronic Ailments', address: 'Dwarka, New Delhi' },
                { id: 'C008', name: 'Nawab City Wellness (LKO)', rating: 4.6, specialization: 'Respiratory & Immunity', address: 'Gomti Nagar, Lucknow' },
            ]
        };

        const doctorsData = {
            'C001': [
                { id: 'D001', name: 'Dr. Ravi Varma', specialization: 'Vamana, Virechana', availability: 'Mon, Wed, Fri' },
                { id: 'D002', name: 'Dr. Neha Kulkarni', specialization: 'Basti, Nasya', availability: 'Tue, Thu, Sat' },
            ],
            'C002': [
                { id: 'D003', name: 'Dr. Amit Singh', specialization: 'Marma, Pinda Sweda', availability: 'Mon - Fri' },
            ],
            'C003': [
                { id: 'D004', name: 'Dr. Smita Rao', specialization: 'Stress & Sleep', availability: 'Mon, Tue, Wed' },
            ],
            'C004': [
                { id: 'D005', name: 'Dr. Vishal Desai', specialization: 'Dermatology', availability: 'Thu, Fri, Sat' },
            ],
            'C005': [
                { id: 'D006', name: 'Dr. Anjali Sharma', specialization: 'General Consultation', availability: 'Mon - Sat' },
            ],
            'C006': [
                { id: 'D007', name: 'Dr. Harish Patel', specialization: 'Cardiology', availability: 'Mon - Fri' },
            ],
            'C007': [
                { id: 'D008', name: 'Dr. Lakshmi Iyer', specialization: 'All Panchakarma', availability: 'Mon - Sat' },
            ],
            'C008': [ // NEW LUCKNOW DOCTORS
                { id: 'D009', name: 'Dr. Alok Verma', specialization: 'Swedana, Vamana', availability: 'Tue, Wed, Sat' },
            ],
            'C009': [ // NEW LUCKNOW DOCTORS
                { id: 'D010', name: 'Dr. Sonal Gupta', specialization: 'Virechana, Basti', availability: 'Mon, Thu, Fri' },
            ],
        };

        let selectedClinicId = null;
        let selectedDoctorId = null;

        const citySelect = document.getElementById('city');
        const clinicContainer = document.getElementById('clinic-cards-container');
        const doctorContainer = document.getElementById('doctor-cards-container');
        const nextButton = document.getElementById('next-button');
        const clinicPlaceholder = document.getElementById('clinic-placeholder');
        const locationStatus = document.getElementById('location-status');

        function updateNextButtonState() {
            if (selectedClinicId && selectedDoctorId) {
                nextButton.disabled = false;
                nextButton.classList.remove('bg-gray-400', 'opacity-50', 'cursor-not-allowed');
                nextButton.classList.add('bg-ayur-green', 'hover:bg-ayur-brown');
            } else {
                nextButton.disabled = true;
                nextButton.classList.add('bg-gray-400', 'opacity-50', 'cursor-not-allowed');
                nextButton.classList.remove('bg-ayur-green', 'hover:bg-ayur-brown');
            }
        }

        // --- Geolocation Logic ---

        // Mock function to simulate finding a city based on coordinates (for demonstration)
        function reverseGeocode(latitude, longitude) {
            // Note: In the sandbox, real location access might be blocked, so this is primarily for demo flow.
            // Added 'lucknow' to mock cities list
            const mockCities = ['bangalore', 'mumbai', 'delhi', 'chennai', 'lucknow', null];
            const randomCity = mockCities[Math.floor(Math.random() * mockCities.length)];
            return randomCity; 
        }

        function detectLocation() {
            if (!navigator.geolocation) {
                locationStatus.textContent = 'Geolocation is not supported by your browser.';
                locationStatus.classList.remove('text-ayur-brown', 'text-ayur-green');
                locationStatus.classList.add('text-red-500');
                return;
            }

            locationStatus.textContent = 'Detecting location... Please ensure location permissions are granted.';
            locationStatus.classList.remove('text-red-500');
            locationStatus.classList.add('text-ayur-brown');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const cityKey = reverseGeocode(lat, lon);
                    
                    if (cityKey) {
                        // Update the dropdown and filter clinics
                        citySelect.value = cityKey;
                        filterClinics(cityKey);
                        locationStatus.textContent = `Location detected! Showing centers in ${citySelect.options[citySelect.selectedIndex].text}.`;
                    } else {
                        // Use the 'unknown' key to show a general list if nearby centers are not mapped
                        citySelect.value = 'unknown'; 
                        filterClinics('unknown');
                        locationStatus.textContent = 'Location detected, but no close centers found. Please select from the general list or manually.';
                    }
                    locationStatus.classList.remove('text-red-500', 'text-ayur-brown');
                    locationStatus.classList.add('text-ayur-green');
                },
                (error) => {
                    let errorMessage = 'Error: Geolocation failed. Please select your city manually.';
                    if (error.code === error.PERMISSION_DENIED) {
                        errorMessage = 'Error: Location access denied. Please click the lock icon in the address bar and allow location access, then try again.';
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        errorMessage = 'Error: Location information is unavailable.';
                    } else if (error.code === error.TIMEOUT) {
                        errorMessage = 'Error: The request to get user location timed out.';
                    }
                    locationStatus.textContent = errorMessage;
                    locationStatus.classList.remove('text-ayur-brown', 'text-ayur-green');
                    locationStatus.classList.add('text-red-500');
                    
                    // Default to showing general list on error
                    citySelect.value = 'unknown'; 
                    filterClinics('unknown');
                }
            );
        }

        // --- Clinic and Doctor Selection Logic ---

        // 1. Filter and render clinics based on city
        function filterClinics(city) {
            selectedClinicId = null;
            selectedDoctorId = null;
            updateNextButtonState();
            clinicContainer.innerHTML = '';
            renderDoctors(null); // Clear doctors

            if (!city) {
                clinicPlaceholder.classList.remove('hidden');
                return;
            }
            clinicPlaceholder.classList.add('hidden');
            
            const clinics = clinicsData[city] || [];
            
            if (clinics.length === 0) {
                clinicContainer.innerHTML = '<p class="text-ayur-brown mt-4 text-center md:col-span-2">No Panchakarma centers found in this area yet.</p>';
                return;
            }

            clinics.forEach(clinic => {
                const card = document.createElement('div');
                card.id = `clinic-${clinic.id}`;
                card.className = 'clinic-card p-4 rounded-xl border-2 border-ayur-light-brown shadow-md hover:border-ayur-green transition-all duration-200 bg-ayur-cream';
                card.setAttribute('data-clinic-id', clinic.id);
                
                card.innerHTML = `
                    <h3 class="text-xl font-bold text-ayur-dark-text">${clinic.name}</h3>
                    <p class="text-sm text-ayur-brown">${clinic.address}</p>
                    <div class="flex items-center space-x-2 mt-2">
                        <span class="text-ayur-green font-semibold">${clinic.rating}</span>
                        <svg class="w-4 h-4 text-yellow-500 fill-current" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.637-.921 1.936 0l1.24 3.824a1 1 0 00.95.691h4.025c.969 0 1.371 1.24.588 1.81l-3.267 2.376a1 1 0 00-.363 1.118l1.24 3.824c.3.921-.755 1.688-1.538 1.118l-3.267-2.376a1 1 0 00-1.175 0l-3.267 2.376c-.783.57-1.838-.197-1.538-1.118l1.24-3.824a1 1 0 00-.363-1.118L2.05 9.252c-.783-.57-.381-1.81.588-1.81h4.025a1 1 0 00.95-.691l1.24-3.824z"></path></svg>
                        <span class="text-ayur-brown text-sm">| ${clinic.specialization}</span>
                    </div>
                `;
                card.onclick = () => selectClinic(clinic.id);
                clinicContainer.appendChild(card);
            });
        }

        // 2. Handle clinic selection
        function selectClinic(clinicId) {
            selectedClinicId = clinicId;
            selectedDoctorId = null; // Reset doctor selection
            
            // Highlight selected card and un-highlight others
            document.querySelectorAll('.clinic-card').forEach(card => {
                card.classList.remove('card-selected', 'border-ayur-green');
                card.classList.add('border-ayur-light-brown');
            });
            document.getElementById(`clinic-${clinicId}`).classList.add('card-selected', 'border-ayur-green');

            renderDoctors(clinicId);
            updateNextButtonState();
        }

        // 3. Render doctors for the selected clinic
        function renderDoctors(clinicId) {
            doctorContainer.innerHTML = '';
            
            if (!clinicId) {
                doctorContainer.innerHTML = '<p class="text-ayur-brown mt-2 text-center md:col-span-3">Select a clinic first to view available doctors.</p>';
                return;
            }

            // Fix for 'unknown' city selection to pull doctor data correctly
            let targetClinicId = clinicId;
            // If the clinic selection is from the 'unknown' list, we need the original clinic ID for doctorsData
            if (citySelect.value === 'unknown') {
                 // Logic to map the selected clinic ID (which might be duplicated across cities) 
                 // to the relevant doctor list. For mock data, we rely on the ID matching the key in doctorsData.
                 targetClinicId = clinicId;
            }

            const doctors = doctorsData[targetClinicId] || [];
            
            if (doctors.length === 0) {
                doctorContainer.innerHTML = '<p class="text-red-500 mt-2 text-center md:col-span-3">No doctors currently available at this center.</p>';
                return;
            }

            doctors.forEach(doctor => {
                const card = document.createElement('div');
                card.id = `doctor-${doctor.id}`;
                card.className = 'doctor-card p-3 rounded-xl border-2 border-ayur-light-brown shadow-sm hover:border-ayur-green transition-all duration-200 text-center bg-ayur-cream';
                card.setAttribute('data-doctor-id', doctor.id);
                card.innerHTML = `
                    <svg class="w-10 h-10 text-ayur-brown mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11V3m0 0l-4 4m4-4l4 4m0 8h-4m4 0h4m-4 0v4m0 0l-4-4m4 4l4-4m-4 4a8 8 0 110-16 8 8 0 010 16z"></path></svg>
                    <h4 class="font-bold text-ayur-dark-text">${doctor.name}</h4>
                    <p class="text-sm text-ayur-green font-medium">${doctor.specialization}</p>
                    <p class="text-xs text-ayur-brown mt-1">Avail: ${doctor.availability}</p>
                `;
                card.onclick = () => selectDoctor(doctor.id);
                doctorContainer.appendChild(card);
            });
        }

        // 4. Handle doctor selection
        function selectDoctor(doctorId) {
            selectedDoctorId = doctorId;
            
            // Highlight selected card and un-highlight others
            document.querySelectorAll('.doctor-card').forEach(card => {
                card.classList.remove('card-selected', 'border-ayur-green');
                card.classList.add('border-ayur-light-brown');
            });
            document.getElementById(`doctor-${doctorId}`).classList.add('card-selected', 'border-ayur-green');

            updateNextButtonState();
        }

        // 5. Simulate navigation for the next step
        document.getElementById('next-button').addEventListener('click', () => {
            if (selectedClinicId && selectedDoctorId) {
                // In a real app, this would redirect to the final scheduling page
                const allClinics = Object.values(clinicsData).flat();
                const clinicName = allClinics.find(c => c.id === selectedClinicId)?.name || 'Unknown Clinic';
                const doctorName = doctorsData[selectedClinicId].find(d => d.id === selectedDoctorId)?.name || 'Unknown Doctor';
                
                const message = `\nSelected Details Confirmed!\n\nClinic: ${clinicName}\nDoctor: ${doctorName}\n\nProceeding to Date & Time Selection (Step 4)...`;
                console.log(message);
                
                // Placeholder action instead of alert()
                locationStatus.textContent = `Success! Selected ${clinicName} with ${doctorName}. Redirecting...`;
                locationStatus.classList.remove('text-ayur-brown', 'text-red-500');
                locationStatus.classList.add('text-ayur-green');
            }
        });

        // Initialize view
        filterClinics(''); 

    </script>
</body>
