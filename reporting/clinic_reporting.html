<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Libraries for PDF and Excel export -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ayur-green': '#4CAF50',
                        'ayur-light-green': '#A5D6A7',
                        'ayur-brown': '#795548',
                        'ayur-light-brown': '#D7CCC8',
                        'ayur-beige': '#FFF8E1',
                        'ayur-cream': '#F8F4E3',
                        'ayur-dark-text': '#3E2723',
                        'ayur-dark-green': '#388E3C', // For hover states
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0F2F5;
        }
        /* Custom class for clickable cards */
        .clickable-card {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .clickable-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="flex min-h-screen text-ayur-dark-text bg-ayur-beige">

                <span>Dashboard</span>

    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-10">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 id="page-title" class="text-3xl font-bold text-ayur-brown">Dashboard</h1>
            <div class="flex items-center space-x-4">
                <button id="menu-btn" class="md:hidden p-2 rounded-lg text-ayur-brown bg-ayur-light-brown hover:bg-ayur-light-green transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <span class="font-semibold text-ayur-brown">Admin, Ayur Wellness Center</span>
                <div class="w-10 h-10 bg-ayur-light-green rounded-full flex items-center justify-center font-bold text-ayur-dark-text">CA</div>
            </div>
        </header>

        <!-- Main content container -->
        <div id="content-container">
            <!-- Content will be injected here by JavaScript -->
        </div>

    </main>

    <script>
        // Global variables must be defined outside DOMContentLoaded for onclick handlers to work
        const contentContainer = document.getElementById('content-container');
        const pageTitle = document.getElementById('page-title');
        const navLinks = document.querySelectorAll('.nav-link');
        const sidebar = document.querySelector('aside');
        let myCharts = {};

        // --- Utility Functions (Globally accessible for inline HTML calls) ---

        function updateNavLinkStyles(activePage) {
            navLinks.forEach(l => {
                l.classList.remove('bg-ayur-green', 'text-white');
                l.classList.add('text-ayur-brown', 'hover:bg-ayur-light-brown');
                
                if (l.dataset.page === activePage) {
                    l.classList.add('bg-ayur-green', 'text-white');
                    l.classList.remove('text-ayur-brown', 'hover:bg-ayur-light-brown');
                }
            });
        }

        function createDashboardCard(title, value, iconPath, pageTarget) {
            return `
                <div class="bg-white p-6 rounded-2xl shadow-lg flex items-center space-x-4 clickable-card" onclick="renderPage('${pageTarget}')">
                    <div class="p-3 bg-ayur-light-green rounded-xl">
                        <svg class="w-8 h-8 text-ayur-green" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}"></path></svg>
                    </div>
                    <div>
                        <div class="text-xl font-medium text-gray-500">${title}</div>
                        <div class="text-4xl font-bold text-ayur-dark-text">${value}</div>
                    </div>
                </div>
            `;
        }
        
        // --- Page Rendering Functions (Globally accessible for inline HTML calls) ---
        
        function renderPage(page) {
            contentContainer.innerHTML = '';
            for (let chart in myCharts) {
                if (myCharts[chart] && typeof myCharts[chart].destroy === 'function') {
                    myCharts[chart].destroy();
                }
            }
            myCharts = {};

            pageTitle.textContent = page.charAt(0).toUpperCase() + page.slice(1);
            updateNavLinkStyles(page); // Ensure sidebar link updates when navigating from dashboard cards

            switch (page) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'patients':
                    renderPatients();
                    break;
                case 'staff':
                    renderStaffPerformance();
                    break;
                case 'revenue': // NEW CASE
                    renderRevenue();
                    break;
                case 'inventory':
                    renderInventory();
                    break;
            }
        }
        
        // --- Component Rendering Functions (Must be defined before or with renderPage) ---

                            </tr>

                            <tr><td class="px-6 py-4 whitespace-nowrap">2025-10-08</td><td class="px-6 py-4 whitespace-nowrap">11:30 AM</td><td class="px-6 py-4 whitespace-nowrap">Kiran Desai</td><td class="px-6 py-4 whitespace-nowrap">Dr. Neha Kulkarni</td><td class="px-6 py-4 whitespace-nowrap">Nasya</td></tr>
                            <tr><td class="px-6 py-4 whitespace-nowrap">2025-10-09</td><td class="px-6 py-4 whitespace-nowrap">09:00 AM</td><td class="px-6 py-4 whitespace-nowrap">Rajesh Menon</td><td class="px-6 py-4 whitespace-nowrap">Dr. Ravi Varma</td><td class="px-6 py-4 whitespace-nowrap">Basti</td></tr>
                            <tr><td class="px-6 py-4 whitespace-nowrap">2025-10-09</td><td class="px-6 py-4 whitespace-nowrap">02:00 PM</td><td class="px-6 py-4 whitespace-nowrap">Priya Rao</td><td class="px-6 py-4 whitespace-nowrap">Dr. Neha Kulkarni</td><td class="px-6 py-4 whitespace-nowrap">Virechana</td></tr>
                            <tr><td class="px-6 py-4 whitespace-nowrap">2025-10-10</td><td class="px-6 py-4 whitespace-nowrap">10:30 AM</td><td class="px-6 py-4 whitespace-nowrap">Vishal Gupta</td><td class="px-6 py-4 whitespace-nowrap">Dr. Ravi Varma</td><td class="px-6 py-4 whitespace-nowrap">Abhyanga</td></tr>
                        </tbody>
                    </table>
                    <div class="text-right mt-4">
                        <button id="exportAppointmentsBtn" class="bg-ayur-green text-white px-4 py-2 rounded-lg font-medium transition-colors hover:bg-ayur-brown">Export Appointment List</button>
                    </div>
                </div>
            `;
            initializeDashboardCharts();
            setupExportButtons('appointmentTable', 'exportAppointmentsBtn');
        }

        // NEW: Revenue Page Function
        function renderRevenue() {

            // Function to set up export buttons for tables
            function setupExportButtons(tableId, buttonId) {
                const exportBtn = document.getElementById(buttonId);
                
                if (exportBtn) {
                    exportBtn.addEventListener('click', () => {
                        const tableToExport = document.getElementById(tableId);
                        if (!tableToExport) return;

                        // Use TableExport for Excel (xlsx)
                        TableExport(tableToExport, {
                            formats: ['xlsx'],
                            filename: `${tableId}_report`,
                            // Remove button after export is done
                            onAfter: () => {
                                document.querySelectorAll('.xlsx').forEach(btn => btn.remove());
                            }
                        });
                        
                        // Note: PDF Export logic using html2canvas/jspdf would be complex for dynamic tables
                        // We rely on TableExport's simplified functionality here.
                    });
                }
